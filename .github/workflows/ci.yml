name: CI

on:
  push:
    branches: [main]
  pull_request:

# the tests run code from the pull request: give them a token that can only read
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      # pinned to commits, so a moved tag upstream cannot change what runs here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable # pinned to a commit, the action no longer reads it from the ref name
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # shortcut: no clippy step, it fails on an existing error in pair.rs; add it once that is fixed
      - run: cargo test --locked
